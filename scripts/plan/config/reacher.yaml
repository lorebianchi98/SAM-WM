cache_dir: null
save_frames: false
n_epoch: null
solver:
  _target_: stable_worldmodel.solver.CEMSolver
  model: ???
  batch_size: 1
  num_samples: 300
  var_scale: 1.0
  n_steps: 30
  topk: 30
  device: cuda
  seed: ${seed}
world:
  env_name: swm/ReacherDMControl-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
  task: qpos_match
dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
  - action
seed: 42
policy: random
plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: reacher.h5
  callables:
  - method: set_state
    args:
      qpos:
        value: qpos
      qvel:
        value: qvel
  - method: set_target_qpos
    args:
      target_qpos:
        value: goal_qpos
output:
  filename: reacher_results.txt
cost_function: mse
mask_type: sam3
threshold: 0.08
mask_threshold: 0.48
weight_cost_strategy: area
textual_query:
- orange circle
- yellow stick
talk2dino_config:
  config_path: scripts/plan/talk2dino_assets/talk2dino_dinov2s.yml
  template_set: sub_imagenet_template
  bg_thresh: -0.02
  proj_asset_root: scripts/plan/talk2dino_assets
video_path: video
output_dir: costs
augmentations_inputs: false
augmentations_goals: false
rastered_masks_goals: false
