defaults:
- launcher: local
- _self_
output_model_name: reacher_gciql_seed${seed}
dataset_name: reacher.h5
trainer:
  max_epochs: 10
  strategy: auto
  devices: auto
  accelerator: gpu
  precision: bf16-mixed
  gradient_clip_val: 1.0
batch_size: 128
num_workers: ${cpus_per_task}
train_split: 0.9
train_subset_fraction: 1.0
seed: 42
image_size: 224
patch_size: 14
n_steps: ${eval:'${dinowm.td_offset} + ${dinowm.history_size}'}
frameskip: 1
dinowm:
  history_size: 3
  td_offset: 1
  use_proprio_encoder: false
  proprio_dim: 4
  proprio_embed_dim: 10
  action_dim: 2
  action_embed_dim: 10
predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.0
  emb_dropout: 0.0
encoder_type: dino
train_value: true
predictor_lr: 3e-4
proprio_encoder_lr: 3e-4
action_encoder_lr: 3e-4
encoder_lr: 3e-4
discount: 0.99
expectile: 0.9
awr_alpha: 10.0
value_ema_tau: 0.995
goal_probabilities:
  random: 0.3
  geometric_future: 0.5
  uniform_future: 0.0
  current: 0.2
actor_goal_probabilities:
  random: 0.5
  geometric_future: 0.0
  uniform_future: 0.5
  current: 0.0
goal_gamma: 0.99
dump_object: true
subdir: null
