defaults:
- launcher: local
- data: tworoom
- _self_
output_model_name: tworoom_gcbc_seed${seed}
trainer:
  max_epochs: 10
  strategy: auto
  devices: auto
  accelerator: gpu
  precision: bf16-mixed
batch_size: 128
num_workers: ${cpus_per_task}
train_split: 0.9
train_subset_fraction: 1.0
seed: 42
image_size: 224
patch_size: 14
wm:
  history_size: 3
  num_preds: 1
  use_proprio_encoder: false
  proprio_dim: 4
  proprio_embed_dim: 10
  action_dim: 2
  action_embed_dim: 10
predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.0
  emb_dropout: 0.0
model:
  _target_: stable_worldmodel.wm.gcrl.gcrl.GCRL
  history_size: ${wm.history_size}
  encoder:
    _target_: stable_worldmodel.wm.prejepa.module.create_backbone
    name: facebook/dinov2-small
  action_predictor:
    _target_: stable_worldmodel.wm.gcrl.module.Predictor
    num_patches: ???
    num_frames: ${wm.history_size}
    dim: ???
    out_dim: ???
    depth: ${predictor.depth}
    heads: ${predictor.heads}
    mlp_dim: ${predictor.mlp_dim}
    dim_head: ${predictor.dim_head}
    dropout: ${predictor.dropout}
    emb_dropout: ${predictor.emb_dropout}
data:
  dataset:
    frameskip: 1
    num_steps: ${eval:'${wm.num_preds} + ${wm.history_size} - 1'}
predictor_lr: 1e-4
proprio_encoder_lr: 1e-4
subdir: null
